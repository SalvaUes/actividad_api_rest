server.port=8085
server.servlet.context-path=/api/v1/demoapirestdam235
app.version=1.0.0

# Configuración de la conexión a MySQL (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/actividad_api?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=api_user
spring.datasource.password=api_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate/JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de JWT
app.jwt.secret=ClaveSecretaSuperSeguraParaJWTEnEstaAplicacionRest2026123456
app.jwt.expiration-ms=86400000

# Configuración de logs
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

server.address=0.0.0.0